<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>עיתון מעלה עמוס · דשבורד חי</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;900&family=Frank+Ruhl+Libre:wght@400;500;700;900&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
<nav class="navbar navbar-expand-lg sticky-top">
  <div class="container">
    <a class="navbar-brand" href="./"><i class="bi bi-newspaper"></i> עיתון מעלה עמוס</a>
    <div class="navbar-nav me-auto">
      <a class="nav-link active" href="./">דשבורד</a>
      <a class="nav-link" href="editor.html">כתיבה</a>
      <a class="nav-link" href="gallery.html">תמונות</a>
      <a class="nav-link" href="archive.html">ארכיון</a>
    </div>
    <span class="text-white-50 small" id="lastSync">טוען...</span>
  </div>
</nav>

<header class="hero">
  <div class="container py-4">
    <h1 class="h2 fw-bold mb-1">דשבורד חי של קבוצת מעלה 2026</h1>
    <p class="mb-0 opacity-75">מעקב, תיוג, והצעות לכתבות — מבוסס על הפעילות בקבוצה</p>
  </div>
</header>

<main class="container py-4">
  <div class="row g-3 mb-4" id="statsRow"></div>

  <div class="row g-3">
    <!-- Article suggestions -->
    <div class="col-lg-7">
      <div class="card shadow-sm mb-3">
        <div class="card-header bg-warning bg-opacity-25 fw-bold">
          <i class="bi bi-lightbulb"></i> הצעות לכתבות (מבוסס על שיחות הקבוצה)
        </div>
        <div class="card-body" id="suggestions">
          <div class="text-muted text-center py-3"><div class="spinner-border spinner-border-sm"></div> טוען הצעות...</div>
        </div>
      </div>

      <!-- Active drafts -->
      <div class="card shadow-sm">
        <div class="card-header fw-bold">
          <i class="bi bi-pencil-square"></i> כתבות בעריכה
          <a href="editor.html" class="btn btn-sm btn-success float-start"><i class="bi bi-plus"></i> חדש</a>
        </div>
        <div class="card-body p-0">
          <div id="articlesList"></div>
        </div>
      </div>
    </div>

    <!-- Live feed -->
    <div class="col-lg-5">
      <div class="card shadow-sm">
        <div class="card-header fw-bold d-flex justify-content-between align-items-center">
          <span><i class="bi bi-chat-dots"></i> פעילות בקבוצה (חי)</span>
          <input type="search" class="form-control form-control-sm" id="feedSearch" placeholder="חפש..." style="max-width:160px">
        </div>
        <div class="card-body p-2" id="liveFeed" style="max-height:75vh;overflow-y:auto">
          <div class="text-muted text-center py-3"><div class="spinner-border spinner-border-sm"></div> טוען...</div>
        </div>
      </div>
    </div>
  </div>
</main>

<footer class="text-center py-4 mt-5 border-top">
  <small class="text-muted">בס"ד · עיתון מעלה עמוס · עדכון אוטומטי כל 5 דקות</small>
</footer>

<script src="assets/js/api.js"></script>
<script src="assets/js/dashboard.js"></script>
</body>
</html>
