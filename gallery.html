<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>בנק תמונות - עיתון מעלה עמוס</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
<nav class="navbar navbar-expand-lg sticky-top">
  <div class="container">
    <a class="navbar-brand" href="./"><i class="bi bi-newspaper"></i> עיתון מעלה עמוס</a>
    <div class="navbar-nav me-auto">
      <a class="nav-link" href="./">בית</a>
      <a class="nav-link" href="editor.html">כתיבה</a>
      <a class="nav-link active" href="gallery.html">תמונות</a>
      <a class="nav-link" href="archive.html">ארכיון</a>
    </div>
  </div>
</nav>

<main class="container py-4">
<div class="row mb-3">
  <div class="col-md-8">
    <h1 class="h3">בנק התמונות הקהילתי</h1>
    <p class="text-muted">חיפוש לפי אירוע, תאריך או מיקום. תיוג אוטומטי על ידי AI.</p>
  </div>
  <div class="col-md-4 text-end">
    <label class="btn btn-success">
      <i class="bi bi-cloud-upload"></i> העלאת תמונות
      <input type="file" multiple accept="image/*" hidden onchange="uploadPhotos(this.files)">
    </label>
  </div>
</div>

<div class="d-flex gap-2 flex-wrap mb-3" id="tagFilters"></div>

<div class="row mb-3">
  <div class="col-md-6">
    <input type="search" class="form-control" id="photoSearch" placeholder="חפש: לג בעומר, מקווה, אסיפה..." oninput="filterPhotos()">
  </div>
  <div class="col-md-3">
    <select class="form-select" id="sortBy" onchange="filterPhotos()">
      <option value="newest">חדשות ראשונות</option>
      <option value="oldest">ישנות ראשונות</option>
    </select>
  </div>
</div>

<div id="uploadProgress" class="mb-3"></div>

<div id="gallery" class="row g-2"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/gallery.js"></script>
</body>
</html>
